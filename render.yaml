# ============================================================
# Render Blueprint — Mad Makers CRM
# https://render.com/docs/blueprint-spec
# ============================================================

services:
  - type: web
    name: madmakers-crm
    runtime: python
    plan: starter               # Instance Starter (payante) : 512 Mo RAM, 0,5 CPU, pas de mise en veille
    branch: main
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r crm/requirements.txt
    # 1 worker + 8 threads (gthread) : un appel lent (IA, audit, envoi) ne gèle
    # plus tout le service, les autres requêtes passent sur les threads libres.
    # 1 seul process = moitié moins de RAM que -w 2 (marge anti-OOM sur 512 Mo).
    startCommand: gunicorn -w 1 --threads 8 -k gthread -b 0.0.0.0:$PORT --timeout 120 --access-logfile - --error-logfile - wsgi:app
    healthCheckPath: /auth/login
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Secrets : à remplir manuellement dans Render Dashboard → Environment
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: noreply@mad-makers.fr
      - key: RESEND_FROM_NAME
        value: Mad Makers CRM
      - key: APP_BASE_URL
        sync: false                 # ex : https://madmakers-crm.onrender.com
      - key: ALLOWED_EMAILS
        sync: false                 # csv des emails whitelistés
